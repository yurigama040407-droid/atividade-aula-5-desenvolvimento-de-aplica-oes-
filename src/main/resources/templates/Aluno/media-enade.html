<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <title>Média do ENADE - Sistema de Gerenciamento de Alunos</title>
    <meta name="author" content="Julius Cavalcante">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.2/font/bootstrap-icons.css">
    <script src="https://kit.fontawesome.com/006642858d.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
</head>
<body>

    <div th:replace="fragmentos/fragmentos :: cabecalho"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-calculator text-primary"></i> Média do ENADE (Alunos Ativos)</h2>
            <a th:href="@{/alunos-adicionados}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Voltar para Alunos
            </a>
        </div>
        <hr>

        <!-- Card de Exibição da Média -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6 col-lg-5">
                <div class="card text-center shadow-sm border-info">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0"><i class="bi bi-award-fill"></i> Média do ENADE (Alunos Ativos)</h4>
                    </div>
                    <div class="card-body py-4">
                        <h1 class="display-3 font-weight-bold text-primary mb-2" th:text="${mediaEnade}">0.0</h1>
                        <p class="text-muted mb-3">Média calculada exclusivamente sobre alunos com status <strong>ATIVO</strong></p>
                        <a th:href="@{/media-enade}" class="btn btn-info text-white font-weight-bold">
                            <i class="bi bi-arrow-repeat"></i> Atualizar Média
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela com Notas dos Alunos Ativos -->
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="bi bi-people-fill"></i> Notas dos Alunos Ativos</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="thead-light">
                            <tr>
                                <th>Nome</th>
                                <th>Curso</th>
                                <th>Matrícula</th>
                                <th>Status</th>
                                <th>Turno</th>
                                <th class="text-center">Nota ENADE</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunosList}">
                                <td th:text="${aluno.nome}"></td>
                                <td th:text="${aluno.curso}"></td>
                                <td th:text="${aluno.matricula}"></td>
                                <td>
                                    <span th:class="${aluno.status.name() == 'ATIVO'} ? 'badge bg-success' : 'badge bg-danger'"
                                          th:text="${aluno.status}"></span>
                                </td>
                                <td th:text="${aluno.turno}"></td>
                                <td class="text-center font-weight-bold text-primary" th:text="${aluno.notaEnade}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alunosList)}">
                                <td colspan="6" class="text-center text-muted py-3">Nenhum aluno ativo cadastrado no momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragmentos/fragmentos :: rodape"></div>

    <script src="/webjars/jquery/3.6.0/jquery.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
