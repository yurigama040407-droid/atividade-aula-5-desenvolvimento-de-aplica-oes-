<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <title>Alunos por Curso</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.2/font/bootstrap-icons.css">
    <script src="https://kit.fontawesome.com/006642858d.js"></script>
</head>
<body>
    <div th:replace="fragmentos/fragmentos :: cabecalho"></div>

    <div class="container">
        <h3>Alunos por Curso</h3>
        <hr>

        <form th:action="@{/alunos-por-curso}" method="get" class="form-inline mb-3">
            <div class="form-group mr-2">
                <label for="curso" class="mr-2">Selecione o Curso:</label>
                <select id="curso" name="curso" class="form-control">
                    <option value="">Todos os Cursos</option>
                    <option th:each="c : ${cursos}" th:value="${c.name()}" th:text="${c.name()}" th:selected="${c == cursoSelecionado}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary ml-2">Filtrar</button>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <th scope="col">Matrícula</th>
                    <th scope="col">Nome</th>
                </thead>
                <tbody>
                    <tr scope="row" th:each="alunos : ${alunosList}">
                        <td th:text="${alunos.matricula}"></td>
                        <td th:text="${alunos.nome}"></td>
                    </tr>
                    <tr th:if="${alunosList.empty}">
                        <td colspan="2" class="text-center">Nenhum aluno encontrado para este curso.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/webjars/jquery/3.6.0/jquery.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
